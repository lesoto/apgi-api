name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run E2E tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: apgi_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        pip install faker httpx pytest-asyncio

    - name: Wait for services to be ready
      run: |
        # Wait for PostgreSQL
        for i in {1..30}; do
          if pg_isready -h localhost -p 5432 -U test_user -d apgi_test; then
            break
          fi
          echo "Waiting for PostgreSQL..."
          sleep 2
        done

        # Wait for Redis
        for i in {1..30}; do
          if redis-cli -h localhost -p 6379 ping | grep -q PONG; then
            break
          fi
          echo "Waiting for Redis..."
          sleep 2
        done

    - name: Run database migrations
      run: |
        export DATABASE_URL="postgresql://test_user:test_password@localhost:5432/apgi_test"
        export REDIS_URL="redis://localhost:6379/0"
        apgi-migrate

    - name: Seed test data
      run: |
        export DATABASE_URL="postgresql://test_user:test_password@localhost:5432/apgi_test"
        export REDIS_URL="redis://localhost:6379/0"
        apgi-seed --users 5 --templates 3 --sessions 10 --tasks 20

    - name: Run E2E tests
      run: |
        export DATABASE_URL="postgresql://test_user:test_password@localhost:5432/apgi_test"
        export REDIS_URL="redis://localhost:6379/0"
        export ENVIRONMENT=test
        export JWT_SECRET_KEY="test-secret-key-for-e2e-testing-only"
        pytest tests/e2e/ -v --tb=short --maxfail=5 --asyncio-mode=auto
      env:
        PYTHONPATH: .

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-test-results
        path: |
          htmlcov/
          .coverage
          pytest-results.xml

    - name: Clean up test data
      if: always()
      run: |
        export DATABASE_URL="postgresql://test_user:test_password@localhost:5432/apgi_test"
        apgi-clear-seed-data --confirm

  performance-tests:
    runs-on: ubuntu-latest
    needs: e2e-tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: apgi_perf_test
          POSTGRES_USER: perf_user
          POSTGRES_PASSWORD: perf_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        pip install faker httpx pytest-asyncio locust

    - name: Run database migrations
      run: |
        export DATABASE_URL="postgresql://perf_user:perf_password@localhost:5432/apgi_perf_test"
        export REDIS_URL="redis://localhost:6379/0"
        apgi-migrate

    - name: Run performance baseline tests
      run: |
        export DATABASE_URL="postgresql://perf_user:perf_password@localhost:5432/apgi_perf_test"
        export REDIS_URL="redis://localhost:6379/0"
        export ENVIRONMENT=test
        export JWT_SECRET_KEY="perf-test-secret-key"
        python -m pytest tests/e2e/test_performance_baseline.py -v --tb=short

    - name: Run load tests
      run: |
        # Start the application
        export DATABASE_URL="postgresql://perf_user:perf_password@localhost:5432/apgi_perf_test"
        export REDIS_URL="redis://localhost:6379/0"
        export ENVIRONMENT=test
        export JWT_SECRET_KEY="perf-test-secret-key"
        python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        APP_PID=$!

        # Wait for app to start
        sleep 10

        # Run load tests
        locust --headless --users 50 --spawn-rate 5 --run-time 2m --host http://localhost:8000 -f tests/load/test_api_load.py

        # Clean up
        kill $APP_PID

    - name: Upload performance results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-test-results
        path: |
          locust-reports/
          performance-results.json
