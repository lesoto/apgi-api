apiVersion: v1
kind: Service
metadata:
  name: apgi-api-service
  namespace: default
  labels:
    app: apgi-api
spec:
  type: LoadBalancer
  selector:
    app: apgi-api
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: apgi-api-service-cluster
  namespace: default
  labels:
    app: apgi-api
spec:
  type: ClusterIP
  selector:
    app: apgi-api
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apgi-api-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.apgi-system.com
    secretName: apgi-api-tls
  rules:
  - host: api.apgi-system.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: apgi-api-service
            port:
              number: 80
